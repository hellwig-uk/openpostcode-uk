name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build
        env:
          OPENPOSTCODEUK_SKIP_IMPORT: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pip install build
          python -m build
      - name: Check artefacts
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          limit = 100 * 1024 * 1024
          dist = Path("dist")
          files = sorted(p for p in dist.iterdir() if p.is_file())
          if not files:
              raise SystemExit("no dist files")
          wheels = [p for p in files if p.suffix == ".whl"]
          sdists = [p for p in files if p.name.endswith(".tar.gz")]
          if not wheels:
              raise SystemExit("missing wheel")
          if not sdists:
              raise SystemExit("missing sdist")
          for path in files:
              size = path.stat().st_size
              print(f"{path.name} {size} bytes")
              if size > limit:
                  raise SystemExit(f"{path.name} exceeds PyPI 100 MB file limit")
          for path in wheels:
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
              sqlite = [n for n in names if n.endswith(".sqlite")]
              caches = [n for n in names if "__pycache__" in n]
              zips = [n for n in names if n.endswith("openpostcode_uk.zip")]
              if sqlite:
                  raise SystemExit(f"wheel contains sqlite: {sqlite}")
              if caches:
                  raise SystemExit(f"wheel contains __pycache__: {caches}")
              if not zips:
                  raise SystemExit("wheel missing openpostcode_uk.zip")
          for path in sdists:
              with tarfile.open(path) as archive:
                  names = archive.getnames()
              sqlite = [n for n in names if n.endswith(".sqlite")]
              if sqlite:
                  raise SystemExit(f"sdist contains sqlite: {sqlite}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/openpostcodeuk
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
