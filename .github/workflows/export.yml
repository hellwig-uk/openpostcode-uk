name: export

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        env:
          OPENPOSTCODEUK_SKIP_IMPORT: "1"
        run: python -m pip install -e ".[dev]"
      - name: Export
        run: python main.py export
      - name: Commit and tag
        id: release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f etl/load/openpostcode_uk.zip etl/sources.json pyproject.toml openpostcodeuk/data/openpostcode_uk.zip
          if git diff --cached --quiet; then
            echo "no export changes"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          git commit -m "export ${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:main --tags
          echo "tagged=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Dispatch PyPI publish
        if: steps.release.outputs.tagged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="v${{ steps.release.outputs.version }}"
          for attempt in 1 2 3 4 5 6; do
            if gh workflow run publish.yml --ref "$ref"; then
              exit 0
            fi
            sleep 10
          done
          echo "failed to dispatch publish.yml for $ref"
          exit 1
