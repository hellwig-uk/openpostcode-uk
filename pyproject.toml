[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openpostcodeuk"
version = "1.2026.299.post1"
description = "UK postcode nearest roads and landmarks from OS Open Names and OS Open Roads"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Martin P. Hellwig", email = "martin@hellwig.uk" },
]
requires-python = ">=3.14"
dependencies = []

[project.urls]
Homepage = "https://github.com/hellwig-uk/openpostcode-uk"
Repository = "https://github.com/hellwig-uk/openpostcode-uk"

[project.scripts]
openpostcode_uk = "openpostcodeuk.cli:main"

[project.optional-dependencies]
dev = [
    "geopandas>=1.0",
    "pyogrio",
    "tqdm",
    "black",
    "isort",
    "coverage",
]

[tool.setuptools]
packages = ["openpostcode", "openpostcodeuk"]

[tool.setuptools.package-data]
openpostcodeuk = ["data/openpostcode_uk.zip"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["openpostcode", "openpostcodeuk"]

[tool.coverage.run]
branch = true
source = ["openpostcode", "openpostcodeuk"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
]
